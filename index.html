<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>tvimchik</title>

  <link rel="icon" href="icon/title.png" type="image/png">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <!-- Аватар -->
    <div class="avatar-wrapper">
      <image
        class="avatar-jpeg"
      >
        <source src="icon/IMG_0217.jpeg" type="image/.jpeg">
      </image>
    </div>

    <!-- Имя -->
    <h1 class="name">tvimchik</h1>

    <!-- Социальные сети -->
    <section class="social-block">

      <h2 class="social-title">
        <span>—</span>
        My social
        <span>—</span>
      </h2>

      <a
        class="social-item"
        href="https://instagram.com/tvimchikk"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="social-icon">
          <i class="fab fa-instagram"></i>
        </span>

        <span class="social-text">Instagram</span>

        <i class="fas fa-arrow-up-right-from-square open-icon"></i>
      </a>

      <a
        class="social-item"
        href="https://t.me/tvimchikkk"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="social-icon">
          <i class="fab fa-telegram-plane"></i>
        </span>

        <span class="social-text">Telegram</span>

        <i class="fas fa-arrow-up-right-from-square open-icon"></i>
      </a>

      <a
        class="social-item"
        href="https://github.com/tvimchik?tab=repositories"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="social-icon">
          <i class="fab fa-github"></i>
        </span>

        <span class="social-text">Github</span>

        <i class="fas fa-arrow-up-right-from-square open-icon"></i>
      </a>

    </section>

    <div class="footer">
      <span>© 2026</span>
      <span>tvimchik</span>
    </div>

  </main>

</body>
</html>
